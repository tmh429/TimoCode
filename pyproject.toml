[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timocode"
version = "0.1.0"
description = "A lightweight terminal coding agent built with Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "referencing>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: opt-in tests against a real model API",
    "docker: opt-in tests against a local Linux Docker engine",
]
